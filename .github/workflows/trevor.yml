# Trevor: generate a fresh AI/tech-news brainrot video and post it to
# Instagram as a Reel. No queue — news must be same-day. TRIGGERED EXTERNALLY
# by cron-job.org at 09:35 IST via the workflow_dispatch API.
# If generation fails, that day simply has no post.
# publish_brainrot.py has a posted-today guard, so duplicate triggers are harmless.
name: trevor

on:
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "generate only, do not post"
        type: boolean
        default: false

concurrency:
  group: trevor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trevor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Write .env from secrets
        run: printf '%s' "$DOTENV" > .env
        env:
          DOTENV: ${{ secrets.DOTENV }}

      - name: Cache TTS model
        uses: actions/cache@v4
        with:
          path: ci-cache
          key: kokoro-model-v1

      - name: Start renderer and TTS
        run: |
          mkdir -p ci-cache data/brainrot data/state
          chmod -R a+rwX data ci-cache
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build renderer tts
          until curl -s http://localhost:8000/health > /dev/null; do sleep 2; done
          until curl -s http://localhost:8001/health > /dev/null; do sleep 2; done
          echo healthy

      - name: Generate today's video
        run: python3 -u scripts/brainrot_pipeline.py

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs renderer --tail 40; docker compose logs tts --tail 20

      - name: Publish to Instagram
        if: ${{ !inputs.skip_publish }}
        run: python3 -u scripts/publish_brainrot.py "$(cat data/brainrot/latest.txt)"

      - name: Keep the video as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trevor-video
          path: data/brainrot/*/final.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline@users.noreply.github.com"
          git add -f data/state/brainrot_covered.json data/state/br_publish_log.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: trevor $(date -u +%F)"
          git pull --rebase && git push
