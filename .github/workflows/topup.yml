# Top-up slot (13:00 IST = 07:30 UTC): if the queue is short (a morning
# generation failed recently), generate one more video under fresh conditions.
# Normally exits within seconds at the queue-cap check.
name: topup

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Queue-cap check
        id: cap
        run: |
          count=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep -c '^queue-' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "queue holds $count video(s)"

      - name: Write .env from secrets
        if: steps.cap.outputs.count < 5
        run: printf '%s' "$DOTENV" > .env
        env:
          DOTENV: ${{ secrets.DOTENV }}

      - name: Cache TTS model
        if: steps.cap.outputs.count < 5
        uses: actions/cache@v4
        with:
          path: ci-cache
          key: kokoro-model-v1

      - name: Start renderer and TTS
        if: steps.cap.outputs.count < 5
        run: |
          mkdir -p ci-cache data/renders data/queue data/experiments data/state
          chmod -R a+rwX data ci-cache
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build renderer tts
          until curl -s http://localhost:8000/health > /dev/null; do sleep 2; done
          until curl -s http://localhost:8001/health > /dev/null; do sleep 2; done
          echo healthy

      - name: Generate one video
        if: steps.cap.outputs.count < 5
        run: python3 -u scripts/generate_daily.py --topup

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs renderer --tail 60; docker compose logs tts --tail 20

      - name: Upload new video to Releases
        if: steps.cap.outputs.count < 5
        run: |
          folder=$(ls -d data/queue/*/ | head -1)
          name=$(basename "$folder")
          gh release create "queue-$name" "$folder"/* \
            --title "queued: $name" --notes "waiting to publish" --latest=false

      - name: Commit state
        if: steps.cap.outputs.count < 5
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline@users.noreply.github.com"
          git add -f data/state/history.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: topup $(date -u +%F)"
          git pull --rebase && git push
