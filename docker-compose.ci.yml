# CI override for GitHub Actions runners.
# Public-repo runners: 4 vCPU / 16 GB — same limits as local production.
# (If the repo ever goes private again, drop renderer to cpus 2 / 4g and tts
# to 2.5g: private runners are 2 vCPU / 7 GB.)
# - ./ci-cache bind mount lets actions/cache keep the TTS model between runs.
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d renderer tts
services:
  renderer:
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 6g
  tts:
    volumes:
      - ./ci-cache:/cache
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g
